<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zugang-Link</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 20px; max-width: 720px; margin: 0 auto; }
    .muted { color:#666; }
    .card { border:1px solid #eee; border-radius:14px; padding:16px; margin-top:14px; }
    input { width:100%; padding:12px; font-size:16px; border:1px solid #ddd; border-radius:10px; }
    .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    button, a.button { display:inline-block; padding:10px 14px; border:1px solid #ddd; border-radius:10px; text-decoration:none; color:#111; background:#fff; cursor:pointer; }
    button:hover, a.button:hover { background:#f6f6f6; }
  </style>
</head>
<body>
  <h1>Zugang-Link fürs Handy</h1>
  <p class="muted">
    Öffne diesen Link auf deinem Handy, um dort Zugriff auf deine Dashboards zu bekommen
    (setzt ebenfalls ein Cookie auf dem Gerät).
  </p>

  <div class="card">
    <div class="muted">Dein persönlicher Link:</div>
    <input id="claimLink" value="{{ full_link }}" readonly />

    <div class="row">
      <button id="copyBtn">Link kopieren</button>
      <a class="button" href="{{ full_link }}">Auf diesem Gerät öffnen</a>
      <a class="button" href="/">← Zur Übersicht</a>
    </div>

    <div id="copied" class="muted" style="margin-top:10px;"></div>
  </div>

  <script>
    const btn = document.getElementById("copyBtn");
    const inp = document.getElementById("claimLink");
    const msg = document.getElementById("copied");

    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(inp.value);
        msg.textContent = "Kopiert ✅";
        setTimeout(() => msg.textContent = "", 1500);
      } catch (e) {
        inp.select();
        document.execCommand("copy");
        msg.textContent = "Kopiert ✅ (Fallback)";
        setTimeout(() => msg.textContent = "", 1500);
      }
    });
  </script>

{% include "footer.html" %}
</body>
</html>
